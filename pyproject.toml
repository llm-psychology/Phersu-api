[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-api"
version = "0.1.0"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
description = "HTTP and SSE integration for persona services"
requires-python = ">=3.10"
dependencies = ["personadough>=0.1,<0.2", "psychanchor>=0.1,<0.2", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "sse-starlette==1.6.5", "PyYAML>=6,<7", "networkx>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
persona_api = ["*.json", "*.txt", "static/*.html"]
